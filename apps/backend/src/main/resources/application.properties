spring.main.web-application-type=reactive
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8080
spring.codec.max-in-memory-size=25MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
legal.intelligence.nlp-service-url=${NLP_SERVICE_URL:http://localhost:5000}
legal.intelligence.storage-dir=${LEGAL_STORAGE_DIR:./data}
legal.intelligence.history-retention-days=${LEGAL_HISTORY_RETENTION_DAYS:30}

# =========================
# Persistence (PostgreSQL)
# =========================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

