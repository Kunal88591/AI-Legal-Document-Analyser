services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  backend:
    build: ./apps/backend
    ports:
      - "8080:8080"
    depends_on:
      nlp-service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NLP_SERVICE_URL=http://nlp-service:5000
      - LEGAL_STORAGE_DIR=/data
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/legalai
      - SPRING_R2DBC_USERNAME=legalai
      - SPRING_R2DBC_PASSWORD=legalai
      - SPRING_FLYWAY_URL=jdbc:postgresql://postgres:5432/legalai
      - SPRING_FLYWAY_USER=legalai
      - SPRING_FLYWAY_PASSWORD=legalai
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - legal-backend-data:/data

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=legalai
      - POSTGRES_USER=legalai
      - POSTGRES_PASSWORD=legalai
    volumes:
      - legal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalai -d legalai"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - legal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nlp-service:
    build: ./apps/ai-service
    ports:
      - "5000:5000"
    environment:
      - LEGAL_DATA_DIR=/data
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - legal-nlp-data:/data

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"

volumes:
  legal-backend-data:
  legal-nlp-data:
  legal-postgres-data:
  legal-redis-data:

