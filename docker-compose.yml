version: '3.8'

services:
  backend:
    build: ./backend-java
    ports:
      - "8080:8080"
    depends_on:
      - nlp-service
    environment:
      - NLP_SERVICE_URL=http://nlp-service:5000

  nlp-service:
    build: ./python-ml-services/nlp-service
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend-react
    ports:
      - "3000:3000"
